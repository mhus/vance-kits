name: essay-pipeline
description: |
  Top-Level-Recipe der Essay-Pipeline. Spawnt einen Marvin-Process,
  dessen Wurzel ein PLAN-Knoten ist; der Plan zerfällt in
   1. WORKER outline_loop  — Plot + Outline mit Lector-Review
   2. EXPAND_FROM_DOC node — pro Item in outline.md ein chapter_loop
   3. WORKER aggregator    — doc_concat + inbox_post

  Aufruf: process_create(engine="marvin", recipe="essay-pipeline").
engine: marvin
params:
  rootTaskKind: PLAN
  manualPaths:
    - manuals/essay/
  # Phase H content-constraint: WORKER children of the root PLAN node
  # MUST use exactly one of these recipes. Marvin's PLAN-validator
  # re-prompts the model on violation (max 2 attempts) and fails the
  # plan node otherwise.
  allowedSubTaskRecipes:
    - outline_loop
    - chapter_loop
  maxPlanCorrections: 2
promptPrefix: |
  Du bist der `essay-pipeline`-PLAN-Knoten. Du erzeugst GENAU
  ZWEI Children in dieser Reihenfolge:

  KIND 1 — WORKER outline_loop:
  ```json
  {
    "taskKind": "WORKER",
    "goal":     "Plot, Personenliste und Kapitel-Outline erzeugen, vom Lector freigegeben.",
    "taskSpec": { "recipe": "outline_loop" }
  }
  ```

  KIND 2 — EXPAND_FROM_DOC, der die Kapitel deterministisch aus
  outline.md aufzählt:
  ```json
  {
    "taskKind": "EXPAND_FROM_DOC",
    "goal":     "Pro Kapitel ein chapter_loop spawnen.",
    "taskSpec": {
      "documentRef": "essay/outline.md",
      "treeMode":    "FLAT",
      "childTemplate": {
        "taskKind": "WORKER",
        "recipe":   "chapter_loop",
        "goal":     "Kapitel {{index1}}: {{item.text}}",
        "recipeParams": {
          "chapterIndex": "{{index1}}",
          "chapterTitle": "{{item.text}}"
        }
      }
    }
  }
  ```

  ABSOLUT VERBOTEN — diese Pläne werden abgelehnt:
   - chapter_loop direkt als WORKER-Children am Top-Level (statt
     im EXPAND_FROM_DOC childTemplate).
   - Mehr als 2 Children am Top-Level. (Die Kapitel werden im
     EXPAND-Knoten generiert, NICHT manuell.)
   - WORKER-Children mit anderen Recipes als `outline_loop` /
     `chapter_loop`.

  Erkenne wenn der LLM-Drang besteht "ich erzeuge gleich N
  Kapitel-Knoten" — das ist falsch. EXPAND_FROM_DOC macht das
  später deterministisch aus outline.md.

  Output-Vertrag (Marvin-Schema), nur diese zwei Children:

      {"children": [
         <KIND 1 oben>,
         <KIND 2 oben>
      ]}
