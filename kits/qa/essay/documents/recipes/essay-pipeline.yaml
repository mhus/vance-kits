name: essay-pipeline
description: |
  Top-Level-Recipe der Essay-Pipeline. Spawnt einen Marvin-Process,
  dessen Wurzel ein PLAN-Knoten ist; der Plan zerfällt in
   1. WORKER outline_loop  — Plot + Outline mit Lector-Review
   2. EXPAND_FROM_DOC node — pro Item in outline.md ein chapter_loop
   3. WORKER aggregator    — doc_concat + inbox_post

  Aufruf: process_create(engine="marvin", recipe="essay-pipeline").
engine: marvin
params:
  rootTaskKind: PLAN
  manualPaths:
    - manuals/essay/
  # Phase H content-constraint: WORKER children of the root PLAN node
  # MUST use exactly one of these recipes. Marvin's PLAN-validator
  # re-prompts the model on violation (max 2 attempts) and fails the
  # plan node otherwise.
  allowedSubTaskRecipes:
    - outline_loop
    - chapter_loop
  maxPlanCorrections: 2
promptPrefix: |
  Du bist der `essay-pipeline`-PLAN-Knoten. Lies zuerst
  `manuals/essay/HOW_TO.md` (`manual_read`), dann generiere
  GENAU diese zwei Sub-Knoten in der angegebenen Reihenfolge:

   1. taskKind: WORKER
      taskSpec:
        recipe: outline_loop
      goal: "Plot, Personenliste und Kapitel-Outline erzeugen,
             vom Lector freigegeben."

   2. taskKind: EXPAND_FROM_DOC
      taskSpec:
        documentRef: essay/outline.md
        treeMode: FLAT
        childTemplate:
          taskKind: WORKER
          recipe: chapter_loop
          goal: "Kapitel {{index1}}: {{item.title}}"
          recipeParams:
            chapterIndex: "{{index1}}"
            chapterTitle: "{{item.title}}"
            chapterSlug:  "{{item.slug}}"

  Output-Vertrag (Marvin-Schema):

      {"children": [
         {"taskKind": "WORKER", "goal": "...",
          "taskSpec": {"recipe": "outline_loop"}},
         {"taskKind": "EXPAND_FROM_DOC", "goal": "...",
          "taskSpec": { … wie oben … }}
      ]}

  WICHTIG: WORKER-Children dürfen NUR die Recipe-Namen
  `outline_loop`, `chapter_loop` verwenden — KEINE anderen Recipes
  erfinden. Andere taskKinds (PLAN/EXPAND_FROM_DOC/USER_INPUT/
  AGGREGATE) brauchen kein Recipe und bleiben frei.
