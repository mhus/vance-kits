name: outline_loop
description: |
  Vogon-Sub-Strategy für den Outline-Review-Loop. Wechselt
  zwischen `creative_writer` (Plot + Outline) und `lector`,
  bis der Lector-Score ≥ 0.7 oder maxIterations=3 erreicht ist.

  Aufruf-Konvention: spawnt sich als child unter dem Marvin-
  Top-Level-Process. Schreibt seine Artefakte ins selbe Project,
  Lector-Score landet als flag.lector_score auf dem Vogon-State.
engine: vogon
params:
  manualPaths:
    - manuals/essay/
  strategyPlanYaml: |
    name: outline-loop
    description: Plot + outline mit Lector-Loop.
    version: "1"
    phases:
      - name: review-loop
        loop:
          maxIterations: 3
          onMaxReached: exit_ok
          until:
            requiresAny:
              - lector_approved
              - review_loop_max_iterations_reached
          subPhases:
            - name: writer
              worker: creative_writer
              workerInput: |
                Erzeuge plot.md, cast.md und outline.md gemäß HOW_TO.md.
                Falls Issues vorliegen, adressiere sie:
                ${flags.lector_issues}
              gate: { requires: [writer_completed] }
            - name: lector
              worker: lector
              workerInput: |
                Bewerte den Outline-Stand (plot.md + cast.md + outline.md).
                Ende mit JSON {score, summary, issues}.
              gate: { requires: [lector_completed] }
              scorer:
                storeAs: lector
                schema:
                  score: float
                  summary: string
                cases:
                  - when: { scoreAtLeast: 0.7 }
                    do:
                      - setFlag: lector_approved
                      - exitLoop: ok
                  - when: { default: true }
                    do:
                      - setFlag: lector_revision_needed
                maxCorrections: 1
