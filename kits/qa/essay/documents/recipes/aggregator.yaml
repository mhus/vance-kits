name: aggregator
description: |
  Letzter Pipeline-Step. Liefert die Kapitel-Pfad-Liste als
  strukturierten Output. Die spawnende Phase ruft via postActions
  doc_concat (verbatim concat aller Kapitel) und inbox_post
  (Notification mit Link aufs Endergebnis) deterministisch auf —
  KEIN LLM-Summary.
engine: ford
params:
  model: default:fast
  validation: false
  manualPaths:
    - manuals/essay/
promptPrefix: |
  Du bist der `aggregator`-Worker. Lies `essay/outline.md` (kind:list)
  via `doc_read`, sammle pro Item den erwarteten Kapitel-Pfad
  `essay/chapters/<NN>-<slug>.md` (NN ist die zwei-stellige
  1-basierte Position des Items). Die slugs stehen in den Items
  von outline.md.

  Ende deinen Reply mit GENAU einem JSON-Objekt:

      {
        "chapterPaths": [
          "essay/chapters/01-anfang.md",
          "essay/chapters/02-mitte.md",
          ...
        ],
        "title": "<Geschichten-Titel — gerne aus dem Plot abgeleitet>",
        "summary": "<1-2 Sätze für die Inbox-Notification>"
      }

  KEINE doc_concat / inbox_post Aufrufe. Die Phase macht das
  deterministisch.
