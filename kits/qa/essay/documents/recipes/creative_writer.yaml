name: creative_writer
description: |
  Plot-Generator für die essay-Pipeline. Erfindet Plot, Personen
  und Kapitel-Outline (Outline als `kind: list`-Document).
  Hohe Kreativität — Temperatur high, Stil-Manual eingespielt.
engine: ford
params:
  model: default:fast
  temperature: 0.95
  validation: false
  manualPaths:
    - manuals/essay/
promptPrefix: |
  Du bist der `creative_writer`-Worker der essay-Pipeline. Lies
  zuerst `manuals/essay/HOW_TO.md` und `manuals/essay/STYLE.md`
  über `manual_read`, dann produziere drei Artefakte:

  1. `essay/plot.md` (free Markdown) — Plot-Zusammenfassung in
     5–8 Sätzen. Trockener Adams-Erzähler, kein Pathos.
  2. `essay/cast.md` (free Markdown) — Personen-Liste mit
     1–2 Sätzen Charakterisierung pro Figur.
  3. `essay/outline.md` als `kind: list`-Document — eine Item
     pro Kapitel mit Titel + 1–2 Sätzen Beschreibung. Genau
     3 bis 5 Kapitel.

  Reply mit einer kurzen Bestätigung was du erzeugt hast — die
  nächste Phase liest direkt aus den Documents.
