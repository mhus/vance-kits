name: chapter_loop
description: |
  Pro Kapitel: writer liefert {chapterText, slug, title} als
  strukturierten Output, Vogon persistiert via postActions
  deterministisch unter essay/chapters/NN-slug.md. Lector-Loop
  folgt — score >= 0.7 schließt ab.
engine: vogon
params:
  manualPaths:
    - manuals/essay/
  strategyPlanYaml: |
    name: chapter-loop
    version: "1"
    phases:
      - name: review-loop
        loop:
          maxIterations: 3
          onMaxReached: exit_ok
          until:
            requiresAny:
              - lector_approved
              - review_loop_max_iterations_reached
          subPhases:
            - name: writer
              worker: writer
              workerInput: |
                Schreib Kapitel ${params.chapterIndex}: ${params.chapterTitle}.
                Slug: ${params.chapterSlug}. Liefere JSON
                {chapterText, slug, title}.
                ${flags.lector_summary}
              outputSchema:
                type: object
                required: [chapterText, slug]
                properties:
                  chapterText: { type: string, minLength: 100 }
                  slug:        { type: string, pattern: "^[a-z0-9-]+$" }
                  title:       { type: string }
              postActions:
                - doc_create_text:
                    path: "essay/chapters/${params.chapterIndex}-${output.slug}.md"
                    title: "${output.title}"
                    content: "${output.chapterText}"
              gate: { requires: [writer_completed] }
            - name: lector
              worker: lector
              workerInput: |
                Bewerte das Kapitel ${params.chapterIndex} aus
                essay/chapters/${params.chapterIndex}-${flags.lector_slug}.md.
                Score 0..1, JSON {score, summary, issues}.
              gate: { requires: [lector_completed] }
              scorer:
                storeAs: lector
                schema:
                  score: float
                  summary: string
                cases:
                  - when: { scoreAtLeast: 0.7 }
                    do:
                      - setFlag: lector_approved
                      - exitLoop: ok
                  - when: { default: true }
                    do:
                      - setFlag: lector_revision_needed
                maxCorrections: 1
