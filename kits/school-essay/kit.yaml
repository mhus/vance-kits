name: school-essay
description: |
  School-Essay-Kit. Genre-spezifischer Aufbau auf dem
  writing-Kit: deckt den klassischen Schul-Aufsatz Klasse 9-10
  (Mittel- und Oberstufe) ab — sachliche Sachtexte mit
  Quellenbelegen, klassische Erörterungen und Pro/Contra-Aufsätze.

  Drei Manuals tragen die Genre-Konvention:

    STRUCTURE.md  — Aufbau Drei-Akt-Schema (Einleitung →
                    Hauptteil → Schluss), 5-6 Kapitel
                    Standard, Kapitellänge 500-650 Wörter,
                    Pro/Contra-Sechsteiler als Default
    STYLE.md      — sachlicher Ton, Belege in (vgl. ...,
                    JJJJ)-Form, Argument-Struktur pro
                    Absatz, was zu vermeiden ist
    OUTPUT.md     — Pfad-Layout unter essay/, Sprache folgt
                    User-Input, Lektorat-Pass-Konvention,
                    was nicht persistiert wird

  Synergie zum writing-Kit:
    drafting        — initialer Roh-Entwurf pro Kapitel
    structural-edit — Outline und Kürzen
    copy-edit       — sachlicher Ton auf Satz-Ebene
    tone-and-voice  — "ich"-Vermeidung, kein Pathos

  Schul-Essay nutzt das writing-Toolkit für die Mechanik, die
  hiesigen Manuals geben die genrespezifische Form.

  Anwendung über Slartibartfast: bei einer User-Bitte wie
  "Schreib mir einen Schul-Aufsatz zu X" liest Slart die drei
  Manuals als Evidence, generiert ein Vogon-Recipe das die
  Genre-Konvention umsetzt (6 Kapitel + Lektorat + Konsolidierung
  unter essay/final-essay.md), und führt es aus.

  Domain-fokussiert: deutscher Schulkontext, übertragbar auf
  andere Genres mit kurzer Anpassung der drei Manuals. Wer einen
  Hochschul-Essay (academic) oder Magisterarbeit braucht, kann
  davon ableiten und STRUCTURE/STYLE schärfen.
