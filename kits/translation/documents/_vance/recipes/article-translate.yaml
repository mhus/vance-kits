# Zielpfad im Projekt: _vance/recipes/article-translate.yaml
# (NICHT `documents/_vance/...` — `_vance` ist ein eigener Root-Folder
# parallel zu `documents/`. RecipeLoader sucht hart unter `_vance/recipes/`.)
#
# LightLlm-Recipe (kein spawnable Worker). Wird vom Skript
# _vance/scripts/translate-article.js per vance.llm.callForJson aufgerufen.

description: |
  Übersetzt Titel und Teaser eines Artikels in einem Aufruf und gibt
  beides als JSON zurück.

  Ein Aufruf statt zwei, weil bei realistischem Volumen der Prompt die
  Token-Rechnung dominiert — grob das Fünffache des Artikeltexts. Zwei
  Aufrufe verdoppeln also die teure Hälfte, um nichts zu sparen.

  Pebble-Variablen:
    title       — Titel, in beliebiger Sprache
    summary     — Teaser; kann leer sein
    targetLang  — BCP-47-Primärsubtag der Zielsprache (de, en, ja, …)

engine: jeltz
internal: true
params:
  model: default:fast
  # Der Schema-Loop von Jeltz darf einmal nachfassen, wenn das Modell
  # kein sauberes JSON liefert.
  maxAttempts: 2
  # Übersetzung ist keine kreative Aufgabe: niedrige Temperatur, damit
  # derselbe Text nicht bei jedem Aufruf anders herauskommt.
  temperature: 0.1
promptPrefix: |
  You are a translator. Translate the title and teaser below into the
  target language.

  ## Target language

  {{ targetLang }}

  ## Title

  {{ title }}

  ## Teaser

  {{ summary }}

  ## Reply format

  Respond with exactly ONE JSON object of this shape — no prose, no
  markdown code fences:

      {
        "title":   "…",
        "summary": "…"
      }

  ## Rules

  - Translate, do not summarise, shorten or comment. The reply is
    consumed by a program, not read by a person.
  - Keep proper nouns, numbers, dates and units as they are.
  - Preserve the register of the source: a headline stays a headline, a
    news lede stays a news lede. Do not add politeness the original does
    not have.
  - If a field is already in the target language, return it unchanged.
  - If the teaser is empty, return an empty string for `summary`. Do not
    invent one from the title.
  - Both fields are always present in the reply, even when one is empty.
tags:
  - internal
  - translation
