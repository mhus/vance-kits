name: translation
description: |
  Übersetzungs-Endpunkt für Fremdsysteme — ein HTTP-POST von außen,
  eine Übersetzung in derselben Antwort.

  Gedacht für Dienste, die viel Text in wechselnden Sprachen sammeln
  und ihn in einer Zielsprache brauchen (erster Konsument: Hrafnagud,
  ein Nachrichten-Sammler). Der Aufrufer braucht dafür weder
  Service-Account noch JWT noch Token-Refresh: ein Bearer-Token und
  ein POST reichen.

  Architektur — drei Dokumente, eine Kette:

    _vance/events/translate-article.yaml    Event, synchron, Bearer-Auth
    _vance/scripts/translate-article.js     ruft vance.llm.callForJsonWithModel
    _vance/recipes/article-translate.yaml   LightLlm-Config-Profil

  Der Event ist eine `script:`-Action und damit per Default synchron —
  das Skript läuft zu Ende und sein Rückgabewert kommt als `output`
  in der HTTP-Antwort zurück. Kein Process-Spawn, kein Lane-Lock,
  kein Polling.

  Aufruf:

    curl -X POST \
      -H "Authorization: Bearer <token>" \
      -H "Content-Type: application/json" \
      -d '{"title": "Council approves plan",
           "summary": "The vote ended a three-year debate.",
           "targetLang": "de"}' \
      https://<brain>/brain/<tenant>/event/<project>/translate-article

    → {"event": "translate-article",
       "workflowName": "script:_vance/scripts/translate-article.js",
       "output": {"title": "Rat beschliesst Plan",
                  "summary": "Die Abstimmung beendete eine dreijaehrige Debatte.",
                  "model": "cortecs:deepseek-v4-pro"}}

  Payload-Felder:
    title       — Titel, beliebige Sprache (Pflicht)
    summary     — Teaser; darf leer sein
    targetLang  — BCP-47-Primärsubtag der Zielsprache; Default aus dem
                  Setting `translation.defaultTargetLang`

  Titel und Teaser gehen in EINEM Modell-Aufruf raus. Bei realistischem
  Volumen dominiert der Recipe-Prompt die Token-Rechnung — grob das
  Fünffache des Artikeltexts —, zwei Aufrufe würden also die teure
  Hälfte verdoppeln, um nichts zu sparen.

  Die Antwort nennt zusätzlich das Modell, das geantwortet hat
  (`model`, kann `null` sein). Das ist aus dem Recipe nicht ableitbar:
  `params.model` ist ein Alias, und eine Fallback-Kette kann ein anderes
  Modell einsetzen. Wer die Übersetzung archiviert, braucht den Wert, um
  zwei Läufe später vergleichen zu können — und muss `null` als
  "unbekannt" ablegen statt als vermutetes Modell.

  Modellwahl über den Alias in `params.model` des Recipes
  (`default:fast`). Wer für Übersetzung ein anderes Modell will,
  ändert den Alias in den Settings — nicht das Recipe.

  ## Token vor dem ersten Einsatz ändern

  Der Event trägt den Token **inline** (`auth.token`). Das ist für
  eine interne Installation in Ordnung und macht das Kit
  sofort lauffähig, hat aber zwei Folgen, die man kennen sollte:
  jede Installation dieses Kits teilt denselben Token, und er steht
  im Klartext in einem Dokument, das Operatoren editieren.

  Für alles, was von außen erreichbar ist, stattdessen:

    auth:
      tokenSetting: translation.token

  und den Wert als PASSWORD-Setting in der Cascade ablegen. Die
  Setting-Referenz ist genau dafür da — siehe
  specification/public/events.md §5.2.
version: "1.0"
hasEncryptedSecrets: false
