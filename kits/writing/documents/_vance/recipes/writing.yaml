description: |
  Writing-architect recipe. Wraps the Slartibartfast engine with
  persistence-aware PROPOSING guidance: every generated Vogon recipe
  has explicit `doc_create`-emitting phases for the artifacts the
  writing-kit (and any kit inheriting from it) declares in its
  OUTPUT.md conventions. Use this preset whenever a writing task
  needs to leave behind actual files in the project — essays,
  chapters, reports, multi-section docs.

  Used by SKILLs that delegate substantive writing work to Slart:
    arthur_action DELEGATE preset="writing" prompt="<user request>"

  Inherits the Slartibartfast plan-architect mechanics (FRAMING →
  CLASSIFYING → DECOMPOSING → PROPOSING → VALIDATING → EXECUTING).
  The only addition is the kit-supplied proposingHints param which
  Slart's PROPOSING phase appends to its system prompt verbatim.

engine: slartibartfast
params:
  # Vogon-strategy — phased plan-and-execute (Gathering → Planning →
  # Executing → Validating). Right shape for "structured document
  # with chapters" intent.
  outputSchemaType: vogon-strategy

  # Slart's per-phase LLM calls benefit from a larger context — it
  # reads many manuals at once during GATHERING.
  model: default:analyze

  # ─── Kit-provided guidance for Slart's PROPOSING phase ─────────
  # Appended to SYSTEM_PROMPT_VOGON before the recipe-yaml is
  # generated. This is where the writing-kit teaches Slart the
  # one thing the generic engine prompt doesn't know: "phases that
  # only return chat-text don't persist anything; emit explicit
  # doc_create-calling phases for every artifact the kit's OUTPUT.md
  # conventions name".
  proposingHints: |
    PHASE CHAINING — Vogon auto-injects a `<phases>` discovery block:

    Before each phase's worker runs, Vogon prepends a block to the
    workerInput listing every completed predecessor phase + the
    path to its captured output (always under
    `_vogon-drafts/<process>/<phase>.md`, written automatically
    after each phase DONEs). The block looks like:

        <phases>
        Already-completed phases — read full text with doc_read,
        or doc_summary for a 1-3-sentence recap:
        - research-sources: _vogon-drafts/<pid>/research-sources.md
        - create-outline:   _vogon-drafts/<pid>/create-outline.md
        </phases>

        <current-phase>draft-chapters</current-phase>

        <your-instructions>
        <your workerInput goes here>
        </your-instructions>

    Consequence for the recipe YAML you emit:

    - DO NOT use `${phases.X.result}` or `${phases.X.draftPath}`
      substitutions in workerInputs. They still work mechanically,
      but they bloat the prompt by inlining the prior phase's full
      reply on every call, and they bypass the doc_summary recap
      shortcut. Let the worker discover via the injected block and
      pull only what it needs.
    - DO write workerInput as a focused per-phase instruction.
      Reference predecessor outputs by phase name and let the
      worker fetch them: "Use doc_summary on `create-outline` and
      doc_read on `research-sources` to ground the draft."
    - DO NOT write Prosa references like "use the outline from the
      previous phase" without naming the phase. The worker can't
      guess which `<phases>` entry you meant.

    PERSISTENCE — every kit-declared artifact still needs an
    explicit tool-call:

    The phase-chaining block above is for Vogon-internal continuity.
    User-facing artifacts named in the kit's OUTPUT.md (e.g.
    `essay/final-essay.md`, `essay/chapters/<NN>-<slug>.md`) are
    SEPARATE — Vogon does not auto-mirror drafts to those paths.
    For every artifact OUTPUT.md names, the recipe MUST include a
    phase whose worker calls doc_create with that path verbatim.

    Use doc_create for persistence phases. It is the single
    canonical "save a document" tool and has upsert semantics:
    it creates the document on the first run and overwrites it at
    the same path on retries. That is exactly what Slart's recovery
    re-spawns need — a second run against an existing file must
    succeed, not stall. doc_create requires three params:
      - path:    the OUTPUT.md path, verbatim (see PATH DISCIPLINE)
      - kind:    "text" for prose / Markdown artifacts (essays,
                 chapters, source lists). Use "text" unless the
                 artifact is a typed kind (mindmap, graph, …).
      - content: the full body to write.
    Use `doc_create` verbatim in every persist phase you emit.

    Pattern for a persistence phase (KEEP IT MINIMAL — exactly
    two tool calls, then respond and stop):

        - name: persist-final-essay
          worker: ford
          workerInput: |
            STRICT BUDGET — this phase uses EXACTLY two tool calls
            and then stops:
              1. doc_read on the predecessor's draft path (see the
                 <phases> block for the exact path).
              2. doc_create with:
                   path:    "essay/final-essay.md"
                   kind:    "text"
                   content: <the full text from step 1, verbatim>
              3. Respond with the one-line confirmation
                 "wrote essay/final-essay.md (<N> chars)". DO NOT
                 verify the write with another doc_read. DO NOT
                 call any further tools. DO NOT edit / polish /
                 summarise the content — that happened in the
                 previous phase.

            Ford's per-turn tool-iteration cap is 8. A persist
            phase that goes beyond doc_read + doc_create +
            respond will exhaust the budget and the phase will
            terminate as FAILED, killing the whole strategy.
          gate: { requires: [final-review-and-format_completed] }

    Rules:
    - Every acceptance criterion that references a tangible
      artifact (essay text, chapter, source list, output document)
      MUST be backed by a persistence phase. If a criterion can
      only be checked by reading a file at a known path, the
      recipe MUST end with a phase that writes that file.
    - Persistence phases come AFTER the content-producing phase
      they persist. They re-read the prior worker's chat reply
      and pipe its content into doc_create. They do not
      rewrite or polish the content.
    - One persistence phase per output artifact is fine — don't
      pack multiple doc_create calls into one workerInput
      unless the worker can hold the full content of all of them
      in a single LLM turn (rare).
    - If the kit's OUTPUT.md names a directory layout like
      essay/chapters/<NN>-<slug>.md, generate one persistence
      phase per chapter; the chapter-producing phases write to
      those exact paths.

    PATH DISCIPLINE — use the OUTPUT.md paths VERBATIM:
    - When OUTPUT.md says `essay/final-essay.md`, the doc_create
      call MUST use that exact string as the path. Not `essay.md`,
      not `final-essay-fast-fashion.md`, not `documents/essay/
      final.md`, not any variant you find clearer. The validator
      and downstream tooling expect the EXACT path the conventions
      doc declares — inventing alternatives means an empty `essay/`
      folder and a re-spawn loop.
    - The path you write into the recipe is a VERBATIM CONSTANT,
      not a template. Do NOT prefix `documents/`, do NOT append
      the topic slug, do NOT pluralise, do NOT translate.
    - If OUTPUT.md uses a placeholder pattern like
      `essay/chapters/<NN>-<slug>.md`, you substitute <NN> with
      the two-digit chapter number (01, 02, …) and <slug> with the
      kebab-case chapter title, but you DO keep the `essay/chapters/`
      prefix and the `.md` suffix exactly as written. The slug must
      stay short (2-5 lowercase words, ASCII, hyphens). Avoid topic-
      specific suffixes — `01-einleitung.md`, not `01-einleitung-
      genetic-engineering.md`.
    - If your evidence (claims extracted during CLASSIFYING) carries
      a path like `essay/sources.md`, use that exact path in the
      persistence phase. Treat evidence paths as the source of
      truth, not as suggestions.
    - Phases that only "review" or "polish" don't need their own
      persistence step — they update the same artifact via
      doc_edit when the workerInput is written that way.

    Without these persistence phases the project's expected
    output folder stays empty, the validator fails the run, and
    Slart will re-spawn the same broken recipe in a loop.

tags:
  - architect
  - writing
  - persistence-aware
