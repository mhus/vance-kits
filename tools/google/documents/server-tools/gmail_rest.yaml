# Gmail Web API pack — works with the user's OAuth 2.0 user-token.
#
# Requires the sibling `oauth/google.yaml` provider and the user to
# have completed the Connect flow with the `gmail.modify` scope (set
# by the template's derived oauth_scopes when feature `mail` is
# selected).
#
# Conditionally installed: only present when `mail` is in the template's
# features selection — see template.yaml#documents.
#
# Auth: Bearer token from user-settings oauth.google.access_token.
# The OAuthTokenRefresher transparently swaps in a fresh token when
# the current one is within 60s of expiry (Google ATs live ~1h).

name: gmail_rest
type: rest_api
description: >
  Gmail via REST — read, search, send, label messages and drafts.
  Works as the connecting user (`me` is always the bound xoxp).
enabled: true
# primary=true so the sub-tools land in every turn's tool manifest
# with their full description + promptHint. Without this, the LLM
# only sees tool NAMES in the discovery block and routinely answers
# "I have no function to mark as read" even though
# gmail.users.messages.modify is configured — the recipe table in
# promptHint never reaches the agent's context.
primary: true
defaultDeferred: false
labels:
  - gmail
  - mail
  - google
parameters:
  # apis.guru is the community-maintained OpenAPI mirror for Google
  # APIs. If upstream rotates the path or goes down, fall back to
  # specInline with a vendored copy in _vance/specs/.
  specUrl: "https://api.apis.guru/v2/specs/googleapis.com/gmail/v1/openapi.json"
  baseUrl: "https://gmail.googleapis.com"
  auth:
    type: bearer
    token: "{{secret:user:oauth.google.access_token}}"
  # The spec emits dotted operationIds (gmail.users.messages.list);
  # vance-toolpack normalises dots to underscores in tool names,
  # but include-matching still operates on the raw form below.
  include:
    # ─── messages: list / read / send / modify (label) / trash
    - "gmail.users.messages.list"
    - "gmail.users.messages.get"
    - "gmail.users.messages.send"
    - "gmail.users.messages.modify"
    - "gmail.users.messages.trash"
    - "gmail.users.messages.untrash"
    - "gmail.users.messages.batchModify"
    # ─── threads (multi-message conversations)
    - "gmail.users.threads.list"
    - "gmail.users.threads.get"
    - "gmail.users.threads.modify"
    - "gmail.users.threads.trash"
    # ─── drafts (compose-without-send)
    - "gmail.users.drafts.create"
    # ─── labels (read taxonomy; create/delete handled out-of-band
    #     in v1 — labels are usually pre-existing)
    - "gmail.users.labels.list"
  # Labels mark POST endpoints that don't mutate state so they ship
  # in the primary tool manifest instead of the deferred bucket.
  # Gmail's send/modify are genuine writes — leave them as default
  # (write + side-effect).
  labelOverrides:
    # The list endpoints are GET — already read-only.  Keep this
    # block as documentation for future read-only POSTs.
  timeoutSeconds: 30
promptHint: |
  ## Gmail (Web API)

  The user's Gmail is connected via xoxp-style user-token. Calls
  appear as the user in Gmail's audit log and "Sent" folder. All
  per-user paths use `userId: "me"` — the connected user IS the
  identity, no impersonation supported.

  Common tools (call via `find_tools(query="gmail")` then `invoke_tool`):

  Read:
  - `gmail_rest__gmail_users_messages_list` —
    `{"userId":"me","q":"from:alice subject:invoice is:unread",
       "maxResults":20}`. Returns just ids; follow with `_get`.
    Query syntax: https://support.google.com/mail/answer/7190
    (operators: from:, to:, subject:, has:attachment, after:, before:,
    label:, is:unread, in:inbox, …).
  - `gmail_rest__gmail_users_messages_get` —
    `{"userId":"me","id":"<message-id>","format":"full"}`. `format`
    can be `metadata` (headers only), `minimal`, `raw`, or `full`.
  - `gmail_rest__gmail_users_threads_list` / `_get` — same shape, for
    conversation view rather than individual messages.

  Send:
  - `gmail_rest__gmail_users_messages_send` — body is a base64url-
    encoded RFC 2822 message inside `{"raw": "<base64>"}` OR a
    multipart MIME structure. The LLM should construct via:
    `{"userId":"me","raw":"<base64url>"}` where the raw is something
    like:
       From: me@gmail.com
       To: alice@example.com
       Subject: ...

       Body text...
    Use `_drafts_create` first for a dry-run.
  - `gmail_rest__gmail_users_drafts_create` — same body shape as
    send, just doesn't ship. Lets you preview.

  Label / mailbox actions:
  - `gmail_rest__gmail_users_messages_modify` — the swiss-army knife.
    Add or remove labels: `{"userId":"me","id":"<id>",
       "addLabelIds":[…],"removeLabelIds":[…]}`. Every common mailbox
    action is a label mutation:

       Action               addLabelIds       removeLabelIds
       ──────────────────────────────────────────────────────
       Mark as read              —            ["UNREAD"]
       Mark as unread        ["UNREAD"]            —
       Archive                   —            ["INBOX"]
       Move back to inbox    ["INBOX"]             —
       Star                  ["STARRED"]           —
       Unstar                    —            ["STARRED"]
       Mark important        ["IMPORTANT"]         —
       Mark not-important        —            ["IMPORTANT"]
       Apply user label      ["Label_123"]         —     (id from labels.list)

    YES — you CAN mark mails as read. It's `removeLabelIds:["UNREAD"]`.

  - `gmail_rest__gmail_users_messages_batchModify` — same shape but
    operates on a list: `{"userId":"me","ids":["<id1>","<id2>",…],
       "removeLabelIds":["UNREAD"]}` to mark a whole search-result
    batch as read in one call. Returns 204, no body.
  - `gmail_rest__gmail_users_messages_trash` /
    `gmail_rest__gmail_users_messages_untrash` —
    `{"userId":"me","id":"<id>"}`. Trash applies the TRASH label and
    removes INBOX; untrash reverses. Use TRASH not DELETE — the
    spec's `_delete` is permanent and we deliberately don't expose it.
  - `gmail_rest__gmail_users_threads_modify` /
    `_threads_trash` — same operations applied to a whole thread
    (all messages in the conversation) rather than a single message.
  - `gmail_rest__gmail_users_labels_list` — enumerate the user's
    labels. System labels (INBOX, SENT, UNREAD, STARRED, IMPORTANT,
    DRAFT, SPAM, TRASH, CATEGORY_PERSONAL/PROMOTIONS/SOCIAL/
    UPDATES/FORUMS) are upper-case constants; user-defined label IDs
    look like `Label_1234567890` — get them via this list first.

  Pitfalls:
  - Message IDs are opaque strings, NOT email addresses.
  - `internalDate` is unix-milliseconds, NOT seconds.
  - The body in `messages.get` is split across `payload.parts[]` —
    deep parse, base64url-decode the relevant part's `body.data`.
    Often easier to pass `format=raw` and parse the RFC 2822 yourself.
