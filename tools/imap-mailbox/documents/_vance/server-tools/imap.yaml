# IMAP mailbox tool.
#
# Auth: user + app-specific-password. The password is referenced via
# {{secret:project:imap.password}} — the template applier persisted it
# in this project's settings during apply, encrypted at rest.
#
# Read sub-tools (always emitted):
#   imap__list_folders
#   imap__list_messages(folder?, limit?, unread_only?, since?)
#   imap__get_message(messageRef, folder?)                  — raw body
#   imap__preview_message(messageRef, folder?, maxBytes?)   — HTML stripped + truncated
#
# Write sub-tools (emitted only when readonly=false):
#   imap__set_seen(messageRef, seen?, folder?)
#   imap__set_flagged(messageRef, flagged?, folder?)
#   imap__move_message(messageRef, targetFolder, folder?)
#   imap__delete_message(messageRef, hard?, folder?)   — soft = move to trashFolder

name: imap
type: imap_mailbox
description: "IMAP inbox: list folders, search by since/unread, read messages."
enabled: true
primary: false
defaultDeferred: false
labels:
  - mail
  - imap
parameters:
  host: {{var:host}}
  port: {{var:port}}
  tls: {{var:tls}}
  user: {{var:user}}
  password: "{{secret:project:imap.password}}"
  defaultFolder: {{var:defaultFolder}}
  readonly: {{var:readonly}}
  trashFolder: {{var:trashFolder}}
  bodyMaxBytes: {{var:bodyMaxBytes}}
  timeoutSeconds: 30
promptHint: |
  ## IMAP mailbox

  Access to an IMAP mailbox. Call via `find_tools(query="imap")` →
  `invoke_tool`.

  Read (always available):

  - `imap__list_folders` — no args; returns folder names
  - `imap__list_messages` — args: `folder` (default INBOX), `limit`
    (1–500), `unread_only` (bool), `since` (ISO-8601 instant). Returns
    headers only (subject/from/date/seen).
  - `imap__get_message` — args: `messageRef` (folder index or
    Message-ID), optional `folder`. Returns headers + the raw body
    (text/plain preferred, text/html as fallback — NOT stripped).
    Use when you need the original markup (link extraction, HTML
    parsing); attachments are ignored in v1.
  - `imap__preview_message` — same args + optional `maxBytes`.
    Returns headers + a plain-text body: HTML stripped via jsoup
    (style/script/inline-images gone), capped at `bodyMaxBytes`
    (default 64 KiB). Token-efficient triage view — use this to
    decide whether a mail is worth reading in full.

  Write (only present when the pack carries `readonly: false`):

  - `imap__set_seen` — mark read / unread. Args: `messageRef`,
    `seen` (bool, default true), `folder` (optional).
  - `imap__set_flagged` — star / unstar. Args: `messageRef`,
    `flagged` (bool, default true), `folder` (optional).
  - `imap__move_message` — move to another folder. Args:
    `messageRef`, `targetFolder` (required), `folder` (source).
  - `imap__delete_message` — soft-delete moves to the pack's
    `trashFolder` (default "Trash"). Pass `hard: true` for
    permanent delete — irreversible.
