name: tools-jira
description: |
  Atlassian Jira als REST-Tool — OAuth-Provider-Config + ServerTool-
  Config in einem Drop. Funktioniert mit jedem Atlassian-Cloud-Account
  (Standard-Plan reicht), kein Rovo / kein MCP nötig.

  Template-Kit: trägt eine sibling-`template.yaml` mit Input-Schema
  (clientId + clientSecret) und ist über den Tool-Templates-Catalog
  (`_tenant/config/tool-templates.yaml`) plus den Web-UI-Wizard / die
  Chat-Agent-Tools `tool_template_*` installierbar. Sieht der Pfad
  über `kit_install` / direkt-curl auch noch, dann mit hartem
  Fehler — `{{var:clientId}}` muss substituiert werden.

  Was das Kit anlegt (nach erfolgreichem `tool_template_apply`):

    documents/_vance/oauth/atlassian.yaml          — OAuth 3LO Provider mit
                                              echter clientId
    documents/server-tools/jira_rest.yaml   — REST-Pack: 7 curated
                                              Operationen (getCurrentUser,
                                              JQL-search, getIssue,
                                              createIssue, editIssue,
                                              addComment, searchProjects)

    setting oauth.atlassian.client_secret   — encrypted im _tenant-Projekt

  **Voraussetzungen für den User:**

    - Atlassian-App registriert auf developer.atlassian.com (mit den
      sechs Scopes der Provider-Config + Callback-URL passend zum
      Deployment).

  Detailliertes Setup-Recipe (inkl. Atlassian-Console-Schritten,
  Token-Test und Troubleshooting): workbench `readme/jira-via-rest-setup.md`.
  Architektur-Hintergrund (warum REST und nicht MCP):
  workbench `readme/jira-via-atlassian-mcp.md`.

version: "1.1"
artifact: true
hasEncryptedSecrets: false
