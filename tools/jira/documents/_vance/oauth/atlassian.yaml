# OAuth 3LO provider for Atlassian Jira / Confluence.
#
# clientId comes from the template input at apply time. The client
# secret is persisted as a tenant-PASSWORD setting by the template
# applier (see template.yaml#inputs[clientSecret].target) — the
# AtlassianOAuthProvider bean looks it up by convention from
# oauth.atlassian.client_secret.
#
# Callback URL the Atlassian developer console must accept (for
# local dev):
#   http://localhost:9900/brain/<tenant>/oauth/atlassian/callback
# In production replace host:port with the reverse-proxy hostname.
#
# All six scopes are required for the curated REST pack to work
# end-to-end (read+write Jira, user identity, refresh).

type: atlassian
clientId: {{var:clientId}}
authorizeUrl: https://auth.atlassian.com/authorize
tokenUrl: https://auth.atlassian.com/oauth/token
scopes:
  - read:jira-work
  - read:jira-user
  - write:jira-work
  - read:me
  - read:account
  - offline_access
extra:
  usePkce: true
