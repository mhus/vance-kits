name: essay-pipeline
description: |
  Top-Level-Recipe der Essay-Pipeline. Spawnt einen Marvin-Process,
  dessen Wurzel ein PLAN-Knoten ist; der Plan zerfällt in
   1. WORKER outline_loop  — Plot + Outline mit Lector-Review
   2. EXPAND_FROM_DOC node — pro Item in outline.md ein chapter_loop
   3. WORKER aggregator    — doc_concat + inbox_post

  Aufruf: process_spawn(engine="marvin", recipe="essay-pipeline").
engine: marvin
params:
  rootTaskKind: PLAN
  manualPaths:
    - manuals/essay/
  # Phase H content-constraint: WORKER children of the root PLAN node
  # MUST use exactly one of these recipes. Marvin's PLAN-validator
  # re-prompts the model on violation (max 2 attempts) and fails the
  # plan node otherwise.
  allowedSubTaskRecipes:
    - outline_loop
    - chapter_loop
    - aggregator_run
  # Phase L: chapter_loop darf nur als child eines EXPAND_FROM_DOC
  # auftauchen (über die outline.md iteriert), nicht als direct
  # WORKER. Verhindert dass der LLM N manuell aufgezählte
  # chapter_loop-Workers als Top-Level-Plan generiert.
  recipesOnlyViaExpand:
    - chapter_loop
  # Phase M: schließt das documentRef-Hallucination-Loch. Der LLM
  # darf für EXPAND_FROM_DOC.documentRef.path NUR diese verbatim
  # Strings benutzen — alles andere (z.B. "story_outline.md",
  # "tasks/.../output.md") wird vom Validator zurückgewiesen.
  allowedExpandDocumentRefPaths:
    - essay/outline.md
  # Phase O.1: childTemplate.recipeParams Pflicht-Keys pro Recipe.
  # Ohne chapterIndex/chapterTitle haben die Chapter-Writer keine
  # Referenz und produzieren Slug-Müll wie "kapitel-titel-fehlt".
  requiredChildTemplateRecipeParams:
    chapter_loop:
      - chapterIndex
      - chapterTitle
  # Phase O.2: AGGREGATE-Kind ist verboten — der LLM soll stattdessen
  # einen WORKER mit recipe=aggregator_run spawnen, der via
  # postActions essay/final-essay.md erzeugt und eine Inbox-
  # Notification absetzt.
  disallowedTaskKinds:
    - AGGREGATE
  maxPlanCorrections: 2
# Trigger keywords for the deterministic recipe-router pre-check.
# Lets the goal-only selector path land on this recipe for essay-
# shaped tasks even when no recipe-name is mentioned verbatim.
triggers:
  keywords:
    - essay
    - kurzgeschichte
    - kurzes essay
promptPrefix: |
  Du bist der `essay-pipeline`-PLAN-Knoten. Du erzeugst GENAU
  DREI Children in dieser Reihenfolge:

  KIND 1 — WORKER outline_loop (erzeugt plot.md, cast.md, outline.md):
  ```json
  {
    "taskKind": "WORKER",
    "goal":     "Plot, Personenliste und Kapitel-Outline erzeugen, vom Lector freigegeben.",
    "taskSpec": { "recipe": "outline_loop" }
  }
  ```

  KIND 2 — EXPAND_FROM_DOC, der die Kapitel deterministisch aus
  outline.md aufzählt. WICHTIG: `documentRef.path` ist EXAKT
  `"essay/outline.md"` — erfinde keine anderen Namen, keine
  `documentRef.name: "outline_document_..."`-Halluzinationen, kein
  String. Genau diese Map-Form, exakt dieser Pfad:
  ```json
  {
    "taskKind": "EXPAND_FROM_DOC",
    "goal":     "Pro Kapitel ein chapter_loop spawnen.",
    "taskSpec": {
      "documentRef": { "path": "essay/outline.md" },
      "treeMode":    "FLAT",
      "childTemplate": {
        "taskKind": "WORKER",
        "recipe":   "chapter_loop",
        "goal":     "Kapitel {{index1}}: {{item.text}}",
        "recipeParams": {
          "chapterIndex": "{{index1}}",
          "chapterTitle": "{{item.text}}"
        }
      }
    }
  }
  ```

  KIND 3 — WORKER aggregator_run (concatenates die Kapitel zu
  essay/final-essay.md und postet eine Inbox-Notification):
  ```json
  {
    "taskKind": "WORKER",
    "goal":     "Kapitel zusammenführen und Notification senden.",
    "taskSpec": { "recipe": "aggregator_run" }
  }
  ```

  ABSOLUT VERBOTEN — diese Pläne werden abgelehnt:
   - chapter_loop direkt als WORKER-Children am Top-Level (statt
     im EXPAND_FROM_DOC childTemplate).
   - Mehr als 3 Children am Top-Level. (Die Kapitel werden im
     EXPAND-Knoten generiert, NICHT manuell.)
   - WORKER-Children mit anderen Recipes als `outline_loop` /
     `chapter_loop` / `aggregator_run`.
   - `taskKind: AGGREGATE` für die Zusammenführung — benutze
     stattdessen den WORKER `aggregator_run` (KIND 3).

  Erkenne wenn der LLM-Drang besteht "ich erzeuge gleich N
  Kapitel-Knoten" — das ist falsch. EXPAND_FROM_DOC macht das
  später deterministisch aus outline.md.

  Output-Vertrag (Marvin-Schema), nur diese drei Children:

      {"children": [
         <KIND 1 oben>,
         <KIND 2 oben>,
         <KIND 3 oben>
      ]}
