name: outline_loop
description: |
  Outline-Phase: creative_writer liefert Plot+Cast+Chapter-Liste
  als strukturierten Output, Vogon persistiert per postActions in
  essay/plot.md, essay/cast.md, essay/outline.md (kind:list).
  Lector-Loop folgt; Score >= 0.7 schließt die Phase ab.
engine: vogon
params:
  manualPaths:
    - manuals/essay/
  strategyPlanYaml: |
    name: outline-loop
    version: "1"
    phases:
      - name: review-loop
        loop:
          maxIterations: 3
          onMaxReached: exit_ok
          until:
            requiresAny:
              - lector_approved
              - review_loop_max_iterations_reached
          subPhases:
            - name: writer
              worker: creative_writer
              workerInput: |
                Liefere Plot, Cast und Outline als JSON gemäß
                Recipe-Schema. Falls bereits ein Lector-Feedback
                vorliegt, adressiere die Punkte: ${flags.lector_summary}
              outputSchema:
                type: object
                required: [plot, cast, chapters]
                properties:
                  plot:    { type: string, minLength: 50 }
                  cast:    { type: string, minLength: 30 }
                  chapters:
                    type: array
                    items:
                      type: object
                      required: [title]
                      properties:
                        title:   { type: string }
                        summary: { type: string }
              maxOutputCorrections: 4
              postActions:
                - doc_create_text:
                    path: "essay/plot.md"
                    title: "Plot"
                    content: "${output.plot}"
                - doc_create_text:
                    path: "essay/cast.md"
                    title: "Cast"
                    content: "${output.cast}"
                - doc_create_kind:
                    path: "essay/outline.md"
                    kind: "list"
                    title: "Kapitel-Outline"
                    itemsFromOutput: "chapters"
              gate: { requires: [writer_completed] }
            - name: lector
              worker: lector
              workerInput: |
                Bewerte den Outline-Stand (essay/plot.md, essay/cast.md,
                essay/outline.md). Score 0.0..1.0. Beende mit JSON
                {score, summary, issues}.
              gate: { requires: [lector_completed] }
              scorer:
                storeAs: lector
                schema:
                  score: float
                  summary: string
                cases:
                  - when: { scoreAtLeast: 0.7 }
                    do:
                      - setFlag: lector_approved
                      - exitLoop: ok
                  - when: { default: true }
                    do:
                      - setFlag: lector_revision_needed
                maxCorrections: 1
